<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Nun Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Cinzel, serif;
    }

    /* HEADER */
    body {
      background-color: #0a0a0a;
      color: #f2f2f2;
      overflow-x: hidden;
      transition: opacity 0.4s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 40px 60px;
      font-weight: 500;
      position: fixed;
      width: 100%;
      z-index: 1000;
    }

    header div {
      font-size: 22px;
      letter-spacing: 3px;
      cursor: pointer;
    }

    nav a {
      text-decoration: none;
      color: #f2f2f2;
      margin-left: 30px;
      border: 1px solid #f2f2f2;
      border-radius: 20px;
      padding: 6px 20px;
      transition: 0.3s;
      font-size: 15px;
    }

    nav a:hover, nav a.active {
      background-color: #f2f2f2;
      color: #111;
    }

    .fade { opacity: 0; }

    /* HOMEPAGE */
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      background: url(images/depan-valak.JPG) center / cover no-repeat;
      position: relative;
      transition: opacity 0.8s ease-in-out;
    }

    .container::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
    }

    .logo {
      width: 500px;
      display: flex;
      display: absolute;
      flex-direction: column;
      align-items: center;
      max-width: 80%;
      z-index: 2;
      position: relative;
      filter: drop-shadow(2px 2px 10px rgba(0,0,0,0.8));
    }

    .buttons {
      margin-top: 50px;
      align-items: center;
      z-index: 2;
      position: relative;
    }

    .buttons button {
      display: block;
      width: 300px;
      margin: 15px auto;
      padding: 14px 25px;
      font-size: 25px;
      border: 1px solid #f2f2f2;
      border-radius: 25px;
      background: transparent;
      color: #f2f2f2;
      cursor: pointer;
      transition: 0.3s;
    }

    .buttons button:hover {
      background-color: #f2f2f2;
      color: #111;
    }

    .tagline {
      margin-top: 40px;
      align-items: center;
      font-style: italic;
      font-size: 25px;
      color: #ddd;
      z-index: 2;
      position: relative;
      text-align: center;
    }

    footer { 
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #999;
      background: #0a0a0a;
    }

  </style>
</head>

<body>

<header>
  <div id="homeHeader">THE NUN UNIVERSE</div>
  <nav>
    <a class="active" id="homeMenu">HOME</a>
    <a id="universeMenu">UNIVERSE</a>
    <a id="aboutMenu">ABOUT</a>
    <a id="contactMenu">CONTACT</a>
  </nav>
</header>

<div class="container" id="home">
  <img src="images/The_Nun_Movie_Logo.png" alt="The Nun Logo" class="logo">
  <div class="buttons">
    <button id="btnNun1">The Nun (2018)</button>
    <button id="btnNun2">The Nun II (2023)</button>
  </div>
  <p class="tagline">“Step into the shadows and face the horror that binds them.”</p>
</div>

<footer>
  &copy; 2025 The Nun Universe | Fan Concept Website by Kelompok 3
</footer>

</body>
</html>
</html>
