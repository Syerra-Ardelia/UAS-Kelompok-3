<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Nun Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Cinzel, serif;
    }

    /* HEADER */
    body {
      background: url(images/Universe.JPG) center / cover no-repeat;
      color: #f2f2f2;
      overflow-x: hidden;
      transition: opacity 0.4s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 40px 60px;
      font-weight: 500;
      position: fixed;
      width: 100%;
      z-index: 1000;
    }

    header div {
      font-size: 22px;
      letter-spacing: 3px;
      cursor: pointer;
    }

    nav a {
      text-decoration: none;
      color: #f2f2f2;
      margin-left: 30px;
      border: 1px solid #f2f2f2;
      border-radius: 20px;
      padding: 6px 20px;
      transition: 0.3s;
      font-size: 15px;
    }

    nav a:hover, nav a.active {
      background-color: #f2f2f2;
      color: #111;
    }

    .fade { opacity: 0; }

    footer { 
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #999;
      background: #0a0a0a;
    }
  </style>
</head> 
<body>
<header>
  <div id="homeHeader">THE NUN UNIVERSE</div>
  <nav>
    <a id="homeMenu">HOME</a>
    <a id="universeMenu">UNIVERSE</a>

    <a class="active" id="contactMenu">CONTACT</a>
  </nav>
